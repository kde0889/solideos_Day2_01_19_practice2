<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelHub - 스마트 여행 플래너</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <i class="fas fa-plane-departure"></i>
                <h1>TravelHub</h1>
            </div>
            <nav class="nav">
                <a href="#home"><i class="fas fa-home"></i> 홈</a>
                <a href="#my-trips"><i class="fas fa-suitcase"></i> 내 여행</a>
                <a href="#premium"><i class="fas fa-crown"></i> 프리미엄</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h2 class="hero-title">당신만의 완벽한 여행을 계획하세요</h2>
            <p class="hero-subtitle">실시간 교통편 검색, 최적 경로 추천, 원클릭 예약까지</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Search Form -->
            <div class="search-card">
                <h3 class="section-title">
                    <i class="fas fa-search"></i> 여행 검색
                </h3>

                <form id="searchForm" class="search-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="departure">
                                <i class="fas fa-map-marker-alt"></i> 출발지
                            </label>
                            <input
                                type="text"
                                id="departure"
                                placeholder="서울"
                                required
                                autocomplete="off"
                            >
                            <div id="departureAutocomplete" class="autocomplete-dropdown"></div>
                        </div>

                        <div class="swap-btn" id="swapBtn" title="출발지/도착지 바꾸기">
                            <i class="fas fa-exchange-alt"></i>
                        </div>

                        <div class="form-group">
                            <label for="arrival">
                                <i class="fas fa-location-dot"></i> 도착지
                            </label>
                            <input
                                type="text"
                                id="arrival"
                                placeholder="부산"
                                required
                                autocomplete="off"
                            >
                            <div id="arrivalAutocomplete" class="autocomplete-dropdown"></div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="departureDate">
                                <i class="fas fa-calendar-days"></i> 출발 날짜
                            </label>
                            <input
                                type="datetime-local"
                                id="departureDate"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="arrivalDate">
                                <i class="fas fa-calendar-check"></i> 도착 날짜 (선택)
                            </label>
                            <input
                                type="datetime-local"
                                id="arrivalDate"
                            >
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group passengers-group">
                            <label>
                                <i class="fas fa-users"></i> 인원
                            </label>
                            <div class="passengers-control">
                                <button type="button" class="btn-passenger" id="decreasePassengers">
                                    <i class="fas fa-minus"></i>
                                </button>
                                <input
                                    type="number"
                                    id="passengers"
                                    value="1"
                                    min="1"
                                    max="9"
                                    readonly
                                >
                                <button type="button" class="btn-passenger" id="increasePassengers">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>

                        <div class="form-group transport-group">
                            <label>
                                <i class="fas fa-bus"></i> 교통수단
                            </label>
                            <div class="transport-options">
                                <label class="transport-checkbox">
                                    <input type="checkbox" name="transport" value="bus" checked>
                                    <span><i class="fas fa-bus"></i> 버스</span>
                                </label>
                                <label class="transport-checkbox">
                                    <input type="checkbox" name="transport" value="train" checked>
                                    <span><i class="fas fa-train"></i> 기차</span>
                                </label>
                                <label class="transport-checkbox">
                                    <input type="checkbox" name="transport" value="flight" checked>
                                    <span><i class="fas fa-plane"></i> 비행기</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-search">
                        <i class="fas fa-magnifying-glass"></i>
                        최적의 여행 경로 찾기
                    </button>
                </form>
            </div>

            <!-- Loading Spinner -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>최적의 여행 경로를 찾고 있습니다...</p>
            </div>

            <!-- Results Section -->
            <div id="results" class="results-section hidden">
                <!-- Map Container -->
                <div class="map-card">
                    <h3 class="section-title">
                        <i class="fas fa-map"></i> 경로 지도
                    </h3>
                    <div id="map" class="map-container"></div>
                    <div class="route-info" id="routeInfo">
                        <div class="route-stat">
                            <i class="fas fa-route"></i>
                            <span id="distance">-- km</span>
                        </div>
                        <div class="route-stat">
                            <i class="fas fa-clock"></i>
                            <span id="duration">-- 분</span>
                        </div>
                    </div>
                </div>

                <!-- Transportation Options -->
                <div class="transport-results">
                    <h3 class="section-title">
                        <i class="fas fa-ticket"></i> 교통편 옵션
                        <span class="sort-options">
                            <button class="sort-btn active" data-sort="price">
                                <i class="fas fa-won-sign"></i> 가격순
                            </button>
                            <button class="sort-btn" data-sort="time">
                                <i class="fas fa-clock"></i> 시간순
                            </button>
                            <button class="sort-btn" data-sort="rating">
                                <i class="fas fa-star"></i> 평점순
                            </button>
                        </span>
                    </h3>

                    <div id="transportOptions" class="transport-cards">
                        <!-- Transport cards will be inserted here by JavaScript -->
                    </div>
                </div>

                <!-- Recommendations -->
                <div class="recommendations-card">
                    <h3 class="section-title">
                        <i class="fas fa-lightbulb"></i> AI 추천
                    </h3>
                    <div id="recommendations" class="recommendations-content">
                        <!-- Recommendations will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>TravelHub</h4>
                    <p>스마트한 여행의 시작</p>
                </div>
                <div class="footer-section">
                    <h4>고객지원</h4>
                    <a href="#">FAQ</a>
                    <a href="#">이용약관</a>
                    <a href="#">개인정보처리방침</a>
                </div>
                <div class="footer-section">
                    <h4>문의하기</h4>
                    <p><i class="fas fa-envelope"></i> support@travelhub.com</p>
                    <p><i class="fas fa-phone"></i> 1588-0000</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 TravelHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Google Maps API -->
    <!-- Replace YOUR_API_KEY with your actual Google Maps API key -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&language=ko"></script>

    <!-- Main JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
